[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "fusion"
description = "fusion tools, plugins and utilities for Jupyter notebooks in the HuBMAP workspace."
dynamic = ["version"]
dependencies = [    
    "requests==2.32.5",
    "pandas>=2.2.0", 
    "girder-client",
    "jupyter-server-proxy",
    "ipyleaflet>=0.19",
    "ipython==8.14.0",
    "tifffile==2024.8.30", 
    "numpy>=1.26.4",
    "tqdm>=4.0",
    "anndata==0.11.4"]
requires-python = ">=3.9"
authors = [
  {name = "Srisharanya Injarapu", email = "injarapu.s@ufl.edu"},
]
readme = "README.md"

[project.scripts]
fusion-get-demos = "fusion.download_notebooks:download_demo_notebooks"
